name: Saanthvana read-only health check

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saanthvana-read-only-health-check
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check six-day cadence
        id: cadence
        env:
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/saanthvana_health_check.py due >> "$GITHUB_OUTPUT"
      - name: Read database health without changing records
        if: steps.cadence.outputs.due == 'true'
        env:
          SAANTHVANA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SAANTHVANA_SUPABASE_PUBLISHABLE_KEY }}
        run: python3 scripts/saanthvana_health_check.py check
