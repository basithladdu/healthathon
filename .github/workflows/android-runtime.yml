name: Android runtime verification

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Android verified packages workflow run from this repository
        required: true
        type: string
      scope:
        description: All checks, focused corrections plus preview, or only the two remaining assertions
        required: true
        type: choice
        default: all
        options:
          - all
          - focused
          - remaining
          - privacy

permissions:
  contents: read
  actions: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUNTIME_SCOPE: ${{ inputs.scope || 'all' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download only a successful same-repository build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          mkdir -p runtime-artifacts runtime-report
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > runtime-report/build-run.json
          python3 android/scripts/ci-runtime.py check-run --run-id "$BUILD_RUN_ID"
          SOURCE=$(python3 -c 'import json; print(json.load(open("runtime-report/build-run.json"))["head_sha"])')
          printf 'source_commit=%s\n' "$SOURCE" >> "$GITHUB_OUTPUT"
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "sahara-android-$SOURCE" --dir runtime-artifacts
      - name: Fetch the exact original build source without retaining credentials
        if: inputs.scope != 'all'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.build.outputs.source_commit }}
          path: runtime-build-source
          persist-credentials: false
      - name: Require identical app source and build inputs before compiling corrected tests
        if: inputs.scope != 'all'
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python3 android/scripts/ci-runtime.py check-source --run-id "$BUILD_RUN_ID" --source-dir runtime-build-source
      - name: Install matching Android tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0"'
      - name: Compile corrected instrumentation APK only; keep downloaded app packages
        if: inputs.scope != 'all'
        working-directory: android
        run: >-
          bash ./gradlew --no-daemon --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx4096m -XX:ActiveProcessorCount=4 -Dfile.encoding=UTF-8'
          -PunsignedRelease=true :app:assembleDebugAndroidTest
      - name: Verify original hashes and prepare runner-only signatures
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python3 android/scripts/ci-runtime.py prepare --run-id "$BUILD_RUN_ID" --scope "$RUNTIME_SCOPE" --source-dir runtime-build-source
      - name: Enable hardware acceleration on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise original downloaded app packages without private accounts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          heap-size: 256M
          cores: 2
          disk-size: 4096M
          disable-animations: true
          enable-hw-keyboard: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 android/scripts/ci-runtime.py run --scope "$RUNTIME_SCOPE"
      - name: Preserve actual runtime evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sahara-runtime-${{ inputs.build_run_id }}-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: error
          path: runtime-report/
