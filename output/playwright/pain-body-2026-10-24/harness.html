<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated Sahara viewer QA</title><style>body{margin:0;background:#f7f9f4;color:#234233;font:14px system-ui}main{width:min(100vw,500px);margin:auto}iframe{display:block;border:0;width:100%;height:580px}nav{display:flex;flex-wrap:wrap;gap:8px;padding:8px}button{min-height:44px;padding:8px 12px;border:1px solid #8ca28f;background:white;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:8px}h1{font-size:16px;padding:8px;margin:0}</style><main><h1>Isolated body viewer QA</h1><iframe id="viewer" title="Sahara body location" src="/viewer/index.html"></iframe><nav><button onclick="qa.view('front')">Front</button><button onclick="qa.view('back')">Back</button><button onclick="qa.rating(1)">Pain 1</button><button onclick="qa.rating(9)">Pain 9</button><button onclick="qa.rating(null)">Unrated</button><button onclick="qa.clear()">Clear</button><button onclick="qa.restore()">Restore</button></nav><pre id="result" aria-live="polite"></pre></main><script>
window.qa={events:[],picks:[],state:{selected:[],rating:null,hindi:false,points:[]},saved:null,apply(){viewer.contentWindow.SaharaPainViewer?.setState(this.state);result.textContent=JSON.stringify({picks:this.picks,state:this.state},null,2)},view(v){viewer.contentWindow.SaharaPainViewer?.setView(v)},rating(r){this.state.rating=r;this.apply()},clear(){this.saved=JSON.parse(JSON.stringify(this.state));this.state={...this.state,selected:[],points:[]};this.apply()},restore(){if(this.saved)this.state=JSON.parse(JSON.stringify(this.saved));this.apply()}};
window.addEventListener('message',e=>{if(e.source!==viewer.contentWindow||e.origin!==location.origin)return;qa.events.push(e.data);if(e.data.type==='ready')qa.apply();if(e.data.type==='pick'){qa.picks.push(e.data);const p={site:e.data.site,...e.data.point};if(!qa.state.selected.includes(p.site))qa.state.selected.push(p.site);qa.state.points=qa.state.points.filter(x=>x.site!==p.site);qa.state.points.push(p);qa.apply()}});
</script></html>
