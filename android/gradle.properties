org.gradle.jvmargs=-Xmx1536m -XX:+UseSerialGC -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# R8 traces code and resources together when shrinking the release build (opt-in on AGP 8.12/8.13, the default from AGP 9).
android.r8.optimizedResourceShrinking=true
